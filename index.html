<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LKPD Interaktif: Menemukan Konsep Berbalik Nilai</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#1d2740;--mu:#5d6b8a;--pr:#5b4bdb;--ac:#ff8a3d;--ok:#16a34a;--no:#dc2626;--bd:#e1e7f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12172b;--card:#1c2340;--tx:#eef1ff;--mu:#a0abcc;--bd:#2d3659;--pr:#8b7fff}}
:root[data-theme="dark"]{--bg:#12172b;--card:#1c2340;--tx:#eef1ff;--mu:#a0abcc;--bd:#2d3659;--pr:#8b7fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#5b4bdb,#8a5cf6 60%,#ff8a3d);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:1.1rem}header small{opacity:.9}
#st{display:flex;gap:6px;padding:10px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
#st button{flex:0 0 auto;border:2px solid var(--bd);background:var(--bg);color:var(--mu);border-radius:20px;padding:5px 12px;font-size:.8rem;cursor:pointer}
#st button.on{background:var(--pr);color:#fff;border-color:var(--pr)}#st button.dn{border-color:var(--ok);color:var(--ok)}#st button.on.dn{color:#fff}
#st button:disabled{opacity:.4}
main{max-width:800px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h2{margin:.1em 0 .4em;font-size:1.25rem}
.tag{display:inline-block;background:var(--pr);color:#fff;border-radius:8px;padding:2px 10px;font-size:.78rem;margin-bottom:6px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:1rem;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:var(--ac)}.btn.ghost{background:none;color:var(--pr);border:2px solid var(--pr)}
input,select,textarea{padding:8px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input.sm{width:84px;text-align:center}textarea{width:100%}
table{border-collapse:collapse;width:100%;text-align:center;margin:8px 0}td,th{border:1px solid var(--bd);padding:7px}th{background:var(--bg)}
.fb{margin-top:8px;padding:10px;border-radius:10px;background:var(--bg);border-left:4px solid var(--pr)}.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.q{background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0}
.box{border:2px dashed var(--pr);border-radius:12px;padding:12px;margin:10px 0;text-align:center}
.bar{height:10px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--ac));transition:width .4s}
.kids{font-size:1.5rem;word-break:break-all;min-height:2.2em}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.05)}100%{transform:scale(1)}}.pop{animation:pop .35s}
.pdfv{--bg:#f4f7fb;--card:#fff;--tx:#1d2740;--mu:#5d6b8a;--pr:#5b4bdb;--bd:#e1e7f2;color:#1d2740}.pdfv .btn,.pdfv input[type=range]{display:none}
#pa{display:none}.pdfv h1,.pdfv h2,.pdfv h3{margin:.3em 0}
@media print{header,#st,.noprint{display:none}body{background:#fff}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body.printall main{display:none}body.printall #pa{display:block;padding:0}.card{box-shadow:none}}
</style></head><body>
<header><h1>🔬 LKPD Interaktif: Temukan Sendiri Konsep Perbandingan Berbalik Nilai</h1><small>Matematika • Kelas 7 • Fase D • Penemuan Terbimbing</small><br><button class="noprint" onclick="pdf()" style="margin-top:8px;border:0;border-radius:10px;padding:6px 12px;cursor:pointer">📄 Unduh PDF (pilih jenis)</button></header>
<div id="st"></div><main id="m"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const N=['Amati','Dugaan','Pola','Uji 1','Uji 2','Rumuskan','Terapkan','Simpulan'];
let S={name:'',step:0,ok:{},v:{},def:'',log:[],dur:{},simN:0};
try{const t=localStorage.getItem('lk2');if(t)S=Object.assign(S,JSON.parse(t))}catch(e){}
S.log=S.log||[];S.dur=S.dur||{};S.simN=S.simN||0;
const save=()=>{try{localStorage.setItem('lk2',JSON.stringify(S))}catch(e){}};
const KEYS=[['a3','a4','a6'],['d1','d2','d3'],['p1','p2','p3','p4','p5'],['b1','b2','b3','b4','b5'],['c1','c2','c3','c4','c5','c6'],['r1','r2'],['t1','t2','t3','t4','t5'],['z1','z2','z3','z4']];
function logA(ok){const a={};KEYS[S.step].forEach(k=>a[k]=S.v[k]||'');if(S.step==5)a.definisi=S.def;if(S.step==7)a.contoh=S.v.z5||'';S.log.push({t:Date.now(),s:S.step,ok:!!ok,a});save()}
let last=null,ts=Date.now();
function tick(){const n=Date.now();if(last!=null)S.dur[last]=(S.dur[last]||0)+(n-ts);ts=n;last=S.step}
const $=s=>document.querySelector(s);
const val=s=>{s=String(s==null?'':s).replace(',','.').trim();if(s.includes('/')){const[a,b]=s.split('/');return parseFloat(a)/parseFloat(b)}return parseFloat(s)};
const near=(a,b)=>Math.abs(a-b)<0.02;
const I=(id,ph)=>`<input class="sm" id="${id}" inputmode="decimal" placeholder="${ph||''}" value="${S.v[id]||''}" oninput="S.v[this.id]=this.value;save()">`;
const SEL=(id,o)=>`<select id="${id}" onchange="S.v[this.id]=this.value;save()"><option value="">pilih…</option>${o.map(x=>`<option ${S.v[id]==x?'selected':''}>${x}</option>`).join('')}</select>`;
const g=id=>$('#'+id).value;
const fb=(ok,t)=>{logA(ok);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'} pop">${ok?'✅':'❌'} ${t}</div>`+(ok?`<button class="btn alt noprint" onclick="nx()">${S.step==7?'Selesai 🎉':'Langkah berikutnya ➜'}</button>`:'');if(ok){S.ok[S.step]=1;save();stp()}};
function nx(){if(S.step<7){S.step++;save();R()}else{S.fin=1;save();R()}}
function stp(){const first=N.findIndex((n,i)=>!S.ok[i]);const mx=first<0?7:first;
$('#st').innerHTML=N.map((n,i)=>`<button class="${S.step==i?'on':''} ${S.ok[i]?'dn':''}" ${i>mx?'disabled':''} onclick="S.step=${i};R()">${i+1}. ${n}${S.ok[i]?' ✓':''}</button>`).join('')}
const head=(i,t,goal)=>`<div class="card"><span class="tag">Langkah ${i+1}/8</span><h2>${t}</h2><div class="bar"><i style="width:${(i+1)/8*100}%"></i></div><p style="color:var(--mu)"><b>Tujuanmu:</b> ${goal}</p>`;
const T=[ // [anak,waktu]
[1,60],[2,30],[3,20],[4,15],[6,10]];

const ST=[
()=>`${head(0,'Amati Masalah','mengumpulkan data dari situasi nyata.')}
<div class="q">🧹 <b>Masalah:</b> Halaman sekolah harus disapu sampai bersih. Jika <b>1 anak</b> mengerjakannya sendiri, butuh <b>60 menit</b>. Semua anak menyapu dengan kecepatan sama.</div>
<p>👇 <b>Coba sendiri!</b> Geser jumlah anak dan lihat waktunya. Catat hasilnya pada tabel.</p>
<input type="range" min="1" max="12" value="${S.v.sl||1}" style="width:100%" oninput="S.v.sl=this.value;S.simN++;sim()"><div class="kids" id="kd"></div><div class="box" id="sm"></div>
<table><tr><th>Jumlah anak</th><td>1</td><td>2</td><td>3</td><td>4</td><td>6</td></tr><tr><th>Waktu (menit)</th><td>60</td><td>30</td><td>${I('a3')}</td><td>${I('a4')}</td><td>${I('a6')}</td></tr></table>
<button class="btn" onclick="c0()">Periksa Tabel</button><div id="fb"></div></div>`,
()=>`${head(1,'Buat Dugaan','menuliskan dugaan awalmu sebelum diuji.')}
<div class="q">Dari simulasi tadi, jawab dengan <b>dugaanmu</b> sendiri (tidak ada jawaban salah, kita akan mengujinya!).</div>
<p>1) Jika jumlah anak <b>bertambah</b>, waktu menyapu… ${SEL('d1',['bertambah','berkurang','tetap'])}</p>
<p>2) Jika jumlah anak menjadi <b>2 kali</b> lipat, waktu menjadi… ${SEL('d2',['2 kali lipat','setengahnya (½ kali)','tidak berubah'])}</p>
<p>3) Menurutmu, apakah waktu ÷ jumlah anak selalu sama? ${SEL('d3',['ya, selalu sama','tidak sama'])}</p>
<button class="btn" onclick="if(g('d1')&&g('d2')&&g('d3'))fb(true,'Dugaanmu tersimpan. Sekarang kita uji dengan data!');else fb(false,'Lengkapi ketiga dugaan dulu.')">Simpan Dugaan</button><div id="fb"></div></div>`,
()=>`${head(2,'Temukan Pola Perubahan','membandingkan perubahan jumlah anak dengan perubahan waktu.')}
<p>Jumlah anak berubah <b>berapa kali</b> lipat, dan waktunya berubah <b>berapa kali</b> lipat? (boleh ditulis 0,5 atau 1/2)</p>
<table><tr><th>Perubahan anak</th><th>Anak jadi … kali</th><th>Waktu jadi … kali</th></tr>
<tr><td>1 → 2 (60 → 30)</td><td>2</td><td>${I('p1')}</td></tr><tr><td>2 → 4 (30 → 15)</td><td>2</td><td>${I('p2')}</td></tr>
<tr><td>1 → 3 (60 → 20)</td><td>3</td><td>${I('p3')}</td></tr><tr><td>3 → 6 (20 → 10)</td><td>2</td><td>${I('p4')}</td></tr></table>
<p>Pola yang kamu lihat: jika anak menjadi <b>n kali</b>, maka waktu menjadi… ${SEL('p5',['n kali juga','kebalikannya (1/n kali)','tetap'])}</p>
<button class="btn" onclick="c2()">Periksa</button><div id="fb"></div></div>`,
()=>`${head(3,'Uji Pertama: Apakah Berbanding Lurus?','menguji dengan hasil bagi (waktu ÷ anak).')}
<div class="q">Pada <b>berbanding lurus</b>, hasil bagi kedua besaran selalu <b>tetap</b>. Mari kita uji! (dibulatkan 1 desimal)</p></div>
<table><tr><th>Anak (x)</th><th>Waktu (y)</th><th>y ÷ x</th></tr><tr><td>1</td><td>60</td><td>${I('b1')}</td></tr><tr><td>2</td><td>30</td><td>${I('b2')}</td></tr><tr><td>3</td><td>20</td><td>${I('b3')}</td></tr></table>
<p>Hasil bagi y ÷ x ${SEL('b4',['selalu tetap','tidak tetap'])} ➜ berarti ini ${SEL('b5',['berbanding lurus','bukan berbanding lurus'])}</p>
<button class="btn" onclick="c3()">Periksa</button><div id="fb"></div></div>`,
()=>`${head(4,'Uji Kedua: Cari Hubungan yang Tetap','menemukan operasi yang hasilnya selalu sama.')}
<p>Karena hasil bagi tidak tetap, coba operasi lain: <b>hasil kali</b> (anak × waktu).</p>
<table><tr><th>Anak (x)</th><th>Waktu (y)</th><th>x × y</th></tr><tr><td>1</td><td>60</td><td>${I('c1')}</td></tr><tr><td>2</td><td>30</td><td>${I('c2')}</td></tr><tr><td>4</td><td>15</td><td>${I('c3')}</td></tr><tr><td>6</td><td>10</td><td>${I('c4')}</td></tr></table>
<p>Hasil kali x × y ${SEL('c5',['selalu tetap','berubah-ubah'])}. Menurutmu angka tetap itu menunjukkan… ${SEL('c6',['total pekerjaan (60 menit-anak)','jumlah anak','waktu tercepat'])}</p>
<button class="btn" onclick="c4()">Periksa</button><div id="fb"></div></div>`,
()=>`${head(5,'Rumuskan Konsep','menyusun rumus dan definisi dengan kata-katamu sendiri.')}
<p>1) Jika x berbanding terbalik dengan y, maka untuk dua pasang data berlaku:<br> x₁ × y₁ = ${SEL('r1',['x₂ × y₂','x₂ ÷ y₂','x₂ + y₂'])}</p>
<p>2) Bentuk perbandingan yang benar (waktu <b>dibalik</b>): <br>${SEL('r2',['x₁/x₂ = y₁/y₂','x₁/x₂ = y₂/y₁'])}</p>
<p>3) Tulis <b>definisi</b> perbandingan berbalik nilai dengan kata-katamu sendiri:</p>
<textarea id="r3" rows="3" oninput="S.def=this.value;save()">${S.def}</textarea>
<button class="btn" onclick="c5()">Periksa &amp; Bandingkan</button><div id="fb"></div></div>`,
()=>`${head(6,'Terapkan dan Bedakan','memakai konsep untuk soal baru dan membedakannya dari berbanding lurus.')}
<div class="q"><b>A. Soal baru.</b> 5 anak membersihkan taman dalam <b>40 menit</b>. Jika dikerjakan <b>8 anak</b>, berapa menit?</div>
<p>① Jenis hubungan: ${SEL('t1',['berbanding lurus','berbalik nilai'])}<br>② Hasil kali tetap (5 × 40) = ${I('t2')}<br>③ Waktu untuk 8 anak = ${I('t3')} menit</p>
<div class="q"><b>B. Bedakan.</b> Tabel pensil: 2 pensil = Rp6.000, 4 pensil = Rp12.000. Hubungan ini… ${SEL('t4',['berbanding lurus','berbalik nilai'])} karena ${SEL('t5',['hasil bagi tetap (Rp3.000)','hasil kali tetap'])}</div>
<button class="btn" onclick="c6()">Periksa</button><div id="fb"></div></div>`,
()=>S.fin?fin():`${head(7,'Simpulan & Diskusi','membandingkan dugaan awal dan menyimpulkan.')}
<div class="q">Dugaan awalmu: waktu jika anak bertambah → <b>${S.v.d1||'-'}</b>; anak 2× → <b>${S.v.d2||'-'}</b>.<br>Setelah diuji, dugaanmu: ${SEL('z1',['benar','perlu diperbaiki'])}</div>
<p>Lengkapi: Dua besaran berbalik nilai jika satu naik, yang lain ${SEL('z2',['naik','turun'])}, dan hasil ${SEL('z3',['kali','bagi'])} keduanya ${SEL('z4',['tetap','berubah'])}.</p>
<p>💬 <b>Diskusi kelompok:</b> Bandingkan definisimu dengan 2 temanmu. Tulis satu contoh berbalik nilai dari kehidupanmu:</p><textarea id="z5" rows="2" oninput="S.v.z5=this.value;save()">${S.v.z5||''}</textarea>
<button class="btn" onclick="c7()">Selesaikan</button><div id="fb"></div></div>`];

function R(){tick();stp();$('#m').innerHTML=S.step==0&&!S.name?`<div class="card"><h2>Halo! 👋</h2><p>Kamu akan menjadi <b>penemu</b>. Tidak ada rumus yang diberikan di awal — kamu menemukannya sendiri lewat 8 langkah.</p><p>Namamu:</p><input id="nm" style="width:100%" placeholder="Tulis nama"><button class="btn" onclick="if(g('nm').trim()){S.name=g('nm').trim();save();R()}">Mulai 🚀</button></div>`:ST[S.step]();if(S.step==0&&S.name)sim();window.scrollTo(0,0)}
function sim(){const n=+(S.v.sl||1);if(!$('#kd'))return;$('#kd').textContent='🧒'.repeat(n);$('#sm').innerHTML=`<b>${n}</b> anak ➜ <b>${+(60/n).toFixed(1)}</b> menit`}
function c0(){const a=[val(g('a3')),val(g('a4')),val(g('a6'))];fb(near(a[0],20)&&near(a[1],15)&&near(a[2],10),near(a[0],20)&&near(a[1],15)&&near(a[2],10)?'Data lengkap! Perhatikan: anak makin banyak, waktu makin sedikit.':'Ada yang belum tepat. Gunakan simulasi di atas untuk mengecek.')}
function c2(){const f=[.5,.5,1/3,.5].map((x,i)=>near(val(g('p'+(i+1))),x)).every(Boolean),k=g('p5')=='kebalikannya (1/n kali)';fb(f&&k,f&&k?'Hebat! Anak ×n ➜ waktu × 1/n. Perubahannya saling berkebalikan.':'Periksa lagi: 60→30 berarti waktu menjadi berapa kali? Lalu pilih pola yang cocok.')}
function c3(){const ok=near(val(g('b1')),60)&&near(val(g('b2')),15)&&Math.abs(val(g('b3'))-6.7)<.1&&g('b4')=='tidak tetap'&&g('b5')=='bukan berbanding lurus';fb(ok,ok?'Betul! 60, 15, 6,7 — hasil bagi tidak tetap, jadi BUKAN berbanding lurus.':'Hitung y ÷ x: 60÷1, 30÷2, 20÷3 (≈6,7), lalu tarik kesimpulan.')}
function c4(){const ok=[1,2,3,4].every(i=>near(val(g('c'+i)),60))&&g('c5')=='selalu tetap'&&g('c6').startsWith('total');fb(ok,ok?'Luar biasa! Hasil kali selalu 60. Ini ciri khas berbalik nilai.':'Hitung 1×60, 2×30, 4×15, 6×10. Angka tetapnya mewakili banyaknya pekerjaan.')}
function c5(){const ok=g('r1')=='x₂ × y₂'&&g('r2')=='x₁/x₂ = y₂/y₁'&&S.def.trim().length>=15;
if(!ok)return fb(false,S.def.trim().length<15?'Tulis definisimu minimal satu kalimat lengkap.':'Ingat: hasil kali tetap, dan perbandingan salah satunya dibalik.');
fb(true,'Rumus benar! <br><i>Definisi baku:</i> dua besaran berbalik nilai jika naiknya satu besaran menyebabkan turunnya besaran lain dengan hasil kali yang tetap. Samakah dengan definisimu? Perbaiki bila perlu.')}
function c6(){const ok=g('t1')=='berbalik nilai'&&near(val(g('t2')),200)&&near(val(g('t3')),25)&&g('t4')=='berbanding lurus'&&g('t5').startsWith('hasil bagi');fb(ok,ok?'Tepat! 5×40=200; 200÷8=25 menit. Pensil: hasil bagi tetap ➜ berbanding lurus.':'Cek: apakah anak bertambah membuat waktu turun? Lalu hitung 200 ÷ 8. Untuk pensil, hitung harga ÷ jumlah.')}
function c7(){const ok=g('z1')&&g('z2')=='turun'&&g('z3')=='kali'&&g('z4')=='tetap'&&(S.v.z5||'').trim().length>=8;fb(ok,ok?'Kamu telah menemukan konsep berbalik nilai sendiri! 🎉':'Lengkapi kalimat simpulan dan tulis satu contohmu.')}
function fin(){return `<div class="card" style="text-align:center"><div style="font-size:3rem">🎓</div><h2>Selamat, ${S.name}!</h2><p>Kamu menyelesaikan 8 langkah penemuan konsep.</p><div class="q" style="text-align:left"><b>Rangkuman penemuanmu:</b><br>• Anak ×n ➜ waktu ×1/n<br>• y ÷ x tidak tetap (bukan berbanding lurus)<br>• x × y = tetap ➜ <b>x₁·y₁ = x₂·y₂</b><br>• Definisimu: <i>${S.def.replace(/</g,'&lt;')}</i><br>• Contohku: <i>${(S.v.z5||'').replace(/</g,'&lt;')}</i></div><button class="btn noprint" onclick="pdf()">📄 Unduh PDF (pilih jenis)</button><button class="btn ghost noprint" onclick="if(confirm('Ulangi dari awal?')){S={name:S.name,step:0,ok:{},v:{},def:'',log:[],dur:{},simN:0};save();R()}">🔄 Ulangi</button></div>`}
const LBL={a3:'Waktu 3 anak (menit)',a4:'Waktu 4 anak (menit)',a6:'Waktu 6 anak (menit)',d1:'Dugaan: anak bertambah, waktu',d2:'Dugaan: anak 2 kali lipat, waktu',d3:'Dugaan: waktu:anak selalu sama?',p1:'Faktor waktu 1->2 anak',p2:'Faktor waktu 2->4 anak',p3:'Faktor waktu 1->3 anak',p4:'Faktor waktu 3->6 anak',p5:'Pola',b1:'y:x (x=1)',b2:'y:x (x=2)',b3:'y:x (x=3)',b4:'Hasil bagi',b5:'Kesimpulan',c1:'x*y (x=1)',c2:'x*y (x=2)',c3:'x*y (x=4)',c4:'x*y (x=6)',c5:'Hasil kali',c6:'Makna angka tetap',r1:'x1*y1 =',r2:'Bentuk perbandingan',definisi:'Definisi siswa',t1:'Jenis hubungan soal A',t2:'Hasil kali tetap',t3:'Waktu 8 anak (menit)',t4:'Jenis hubungan pensil',t5:'Alasan',z1:'Dugaan awal',z2:'Satu naik, lainnya',z3:'Operasi tetap',z4:'Hasilnya',contoh:'Contoh dari siswa'};
const cl=t=>String(t==null?'':t).replace(/×/g,'x').replace(/÷/g,':').replace(/₁/g,'1').replace(/₂/g,'2').replace(/⅓/g,'1/3').replace(/≈/g,'~').replace(/[➜→]/g,'->').replace(/[^\x0A\x20-\x7E\u00A0-\u00FF]/g,'');
const fd=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+' mnt '+(s%60)+' dtk'};
async function pdfAct(){
tick();
const J=window.jspdf&&window.jspdf.jsPDF;if(!J){printAct();return}
const d=new J({unit:'mm',format:'a4'});let y=34;
